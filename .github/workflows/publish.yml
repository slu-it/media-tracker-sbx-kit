name: validate and publish kit

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install sbx
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get install -y docker-sbx
          sbx version

      - name: Log in to Docker (sbx)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: echo "$DOCKER_TOKEN" | sbx login --username "$DOCKER_USERNAME" --password-stdin

      - name: Validate kit
        run: sbx kit validate ./kit

  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # id-token: write   # only for the optional keyless signing below
    steps:
      - uses: actions/checkout@v4

      - name: Install sbx
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get install -y docker-sbx

      - name: Log in to Docker (sbx)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: echo "$DOCKER_TOKEN" | sbx login --username "$DOCKER_USERNAME" --password-stdin

      - name: Check tag matches spec version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SPEC_VERSION="$(yq '.version' kit/spec.yaml)"
          if [ "$TAG_VERSION" != "$SPEC_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match kit/spec.yaml version $SPEC_VERSION"
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          # GHCR requires a lowercase namespace
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/media-tracker-sbx-kit" >> "$GITHUB_ENV"

      # sbx kit push falls back to the Docker credential store
      - name: Log in to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push kit
        run: |
          sbx kit push ./kit "$IMAGE:$VERSION"
          # Optional keyless Sigstore signing (needs id-token: write above):
          # sbx kit push ./kit "$IMAGE:$VERSION" --sign
          echo "Published $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
